<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 六院体检业务投标管理系统</title>
    <!-- Favicon: 紫色主题 SVG 图标 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%236d28d9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect rx='12' ry='12' width='64' height='64' fill='url(%23g)'/%3E%3Cg stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3Cpath d='M22 22v-4h20v4'/%3E%3Crect x='12' y='22' width='40' height='30' rx='6'/%3E%3Cpath d='M12 38h40'/%3E%3C/g%3E%3C/svg%3E"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', 'Heiti SC', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e5e5;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        
        
        .login-container {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 40px; /* 固定像素，跨浏览器一致 */
            width: 390px; /* 固定宽度（减小30px） */
            max-width: 92vw;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .logo svg {
            width: 24px;
            height: 24px;
            color: white;
        }
        
        .login-title {
            font-size: 24px;
            line-height: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f3f4f6;
            font-family: 'Noto Sans SC', 'Inter', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            white-space: nowrap; /* 避免不同浏览器换行差异 */
        }
        
        .login-subtitle {
            color: #9ca3af;
            font-size: 14px;
            line-height: 20px;
        }
        
        .avatar-section {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .avatar-upload {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }
        
        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #374151, #4b5563);
            border: 3px solid #7c3aed; /* 紫色主题 */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
        }
        
        .avatar-preview:hover {
            border-color: #8b5cf6; /* 紫色 hover */
            transform: scale(1.05);
        }
        
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .avatar-preview svg {
            width: 32px;
            height: 32px;
            color: #9ca3af;
        }
        
        .avatar-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        
        .avatar-text {
            color: #9ca3af;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #d1d5db;
            font-weight: 500;
            font-size: 14px;
            line-height: 20px;
        }
        
        .input-group { position: relative; }
        .input-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; color: #9ca3af;
        }
        .form-input { width: 100%; }
        /* 与列表页搜索框一致的输入风格 */
        .search-like {
            height: 34px;
            padding-left: 2rem; /* pl-8 */
            padding-right: 0.75rem; /* pr-3 */
            background: #101211; /* bg-[#101211] */
            border: 1px solid #1c1e1d; /* border-dark-100 近似 */
            border-radius: 6px; /* rounded-md */
            color: #e5e7eb;
            font-size: 0.875rem; /* text-sm */
            outline: none; /* focus:outline-none */
            transition: box-shadow .2s, border-color .2s;
        }
        .search-like:focus {
            border-color: #8b5cf6; /* focus:border-primary */
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25); /* focus:ring-1 ring-primary 视觉等效 */
        }

        /* 修复浏览器自动填充把输入框背景变白/发黄的问题（Chrome/Edge/Safari） */
        input.search-like:-webkit-autofill,
        input.search-like:-webkit-autofill:hover,
        input.search-like:-webkit-autofill:focus {
            -webkit-text-fill-color: #e5e7eb !important; /* 文本颜色 */
            caret-color: #e5e7eb;
            -webkit-box-shadow: 0 0 0 1000px #101211 inset; /* 覆盖 autofill 背景 */
            box-shadow: 0 0 0 1000px #101211 inset;
            border: 1px solid #1c1e1d; /* 与常态一致 */
            transition: background-color 9999s ease-out 0s; /* 避免闪烁 */
        }
        input.search-like:-webkit-autofill:focus {
            border-color: #8b5cf6; /* 聚焦时仍保持紫色边框 */
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25), 0 0 0 1000px #101211 inset;
        }
        /* Firefox */
        input.search-like:-moz-autofill {
            box-shadow: 0 0 0 1000px #101211 inset;
            -moz-text-fill-color: #e5e7eb;
            caret-color: #e5e7eb;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #8b5cf6; /* 紫色聚焦 */
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }
        
        .form-input::placeholder {
            color: #6b7280;
        }
        
        .login-button {
            width: 100%;
            padding: 0.875rem 1rem;
            background: #7c3aed; /* 与“新增业务”一致的纯色主按钮 */
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        
        .login-button:hover {
            background: #6d28d9; /* hover:bg-primary/90 */
            transform: translateY(-1px);
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.35);
        }
        
        .login-button:active {
            transform: translateY(0);
        }
        
        .login-footer {
            text-align: center;
            color: #9ca3af;
            font-size: 0.75rem;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        @media (max-width: 480px) {
            .login-container {
                margin: 1rem;
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 7V5h6v2"/>
                    <rect x="3" y="7" width="18" height="14" rx="2"/>
                    <path d="M3 13h18"/>
                </svg>
            </div>
            <h1 class="login-title">六院体检业务投标管理系统</h1>
            <p class="login-subtitle">登录您的账户以继续</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'error-message' if category == 'error' else 'success-message' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('ui_login') }}" enctype="multipart/form-data" id="loginForm">
            <div class="avatar-section">
                <div class="avatar-upload">
                    <div class="avatar-preview" id="avatarPreview">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <input type="file" name="avatar" id="avatarInput" class="avatar-input" accept="image/*">
                </div>
                <p class="avatar-text">点击上传头像（可选）</p>
            </div>
            
            <div class="form-group">
                <label for="username" class="form-label">用户名</label>
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"/>
                        <path d="M12 14a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7z"/>
                    </svg>
                    <input type="text" id="username" name="username" class="form-input search-like" placeholder="请输入用户名" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="10" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" name="password" class="form-input search-like" placeholder="请输入密码" required>
                </div>
            </div>
            
            <button type="submit" class="login-button" style="height:34px;display:flex;align-items:center;justify-content:center;">
                登录
            </button>
        </form>
        
        <div class="login-footer">
            <p>©2025 MaeR 保留所有权利</p>
        </div>
    </div>
    
    <script>
        // 头像预览功能
        const avatarInput = document.getElementById('avatarInput');
        const avatarPreview = document.getElementById('avatarPreview');
        
        avatarInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        avatarPreview.innerHTML = `<img src="${e.target.result}" alt="Avatar preview">`;
                    };
                    reader.readAsDataURL(file);
                } else {
                    alert('请选择有效的图片文件');
                }
            }
        });
        // 支持点击预览区域触发文件选择
        avatarPreview.addEventListener('click', function(){
            avatarInput.click();
        });
        
        // 表单提交处理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                e.preventDefault();
                alert('请填写用户名和密码');
                return;
            }
        });
    </script>
</body>
</html>
